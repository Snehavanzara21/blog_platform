<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogVerse · Blog Platform</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f7f9fc;
            color: #0f172a;
            min-height: 100vh;
        }

        .app-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1.2rem 1.5rem 3rem;
        }

        /* Header */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0 1.2rem;
            border-bottom: 1px solid #e9edf2;
            margin-bottom: 2rem;
            gap: 1rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 700;
            font-size: 1.6rem;
            letter-spacing: -0.5px;
        }
        .brand i {
            color: #8b5cf6;
            font-size: 1.8rem;
        }
        .brand span {
            color: #8b5cf6;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: white;
            padding: 0.2rem 0.8rem 0.2rem 0.8rem;
            border-radius: 40px;
            border: 1px solid #e9edf2;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            background: #ede9fe;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #5b21b6;
        }

        .btn-logout {
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 1rem;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            transition: 0.2s;
        }
        .btn-logout:hover {
            background: #fee2e2;
            color: #b91c1c;
        }

        .btn-primary {
            background: #8b5cf6;
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.6rem 1.6rem;
            border-radius: 40px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary:hover {
            background: #7c3aed;
            transform: scale(0.98);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid #e2e8f0;
            color: #1e293b;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }
        .btn-outline:hover {
            background: #f1f5f9;
        }

        .btn-danger {
            background: #ef4444;
            border: none;
            color: white;
            padding: 0.3rem 0.9rem;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.8rem;
        }
        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-success {
            background: #22c55e;
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-success:hover {
            background: #16a34a;
        }

        /* Auth Card */
        .auth-card {
            max-width: 420px;
            margin: 2rem auto;
            background: white;
            padding: 2.2rem 2rem;
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
        }
        .auth-title {
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 0.2rem;
        }
        .auth-sub {
            color: #64748b;
            margin-bottom: 1.8rem;
        }
        .auth-toggle {
            color: #8b5cf6;
            font-weight: 600;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 0.95rem;
        }
        .auth-toggle:hover {
            text-decoration: underline;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
            color: #334155;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            font-size: 0.95rem;
            background: #f8fafc;
            transition: 0.2s;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: 2px solid #8b5cf6;
            outline-offset: 2px;
            background: white;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Blog Posts */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 1.8rem 0 1.2rem;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .section-title {
            font-weight: 600;
            font-size: 1.4rem;
        }

        .post-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #edf2f7;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            transition: 0.2s;
        }
        .post-card:hover {
            border-color: #d4c4f7;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .post-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #0f172a;
        }
        .post-meta {
            font-size: 0.8rem;
            color: #94a3b8;
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .post-author {
            font-weight: 500;
            color: #475569;
        }
        .post-content {
            color: #334155;
            line-height: 1.6;
            margin: 0.6rem 0 1rem;
            word-wrap: break-word;
        }
        .post-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        /* Comments */
        .comment-section {
            margin-top: 1.2rem;
            border-top: 1px solid #f1f5f9;
            padding-top: 1rem;
        }
        .comment-item {
            padding: 0.6rem 0;
            border-bottom: 1px solid #f8fafc;
        }
        .comment-item:last-child {
            border-bottom: none;
        }
        .comment-author {
            font-weight: 600;
            font-size: 0.85rem;
            color: #1e293b;
        }
        .comment-text {
            color: #475569;
            font-size: 0.95rem;
            margin: 0.2rem 0 0.2rem;
        }
        .comment-meta {
            font-size: 0.7rem;
            color: #94a3b8;
        }
        .comment-form {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }
        .comment-form input {
            flex: 1;
            min-width: 160px;
            padding: 0.5rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 30px;
            font-size: 0.9rem;
            background: #f8fafc;
        }
        .comment-form input:focus {
            outline: 2px solid #8b5cf6;
            outline-offset: 2px;
        }
        .comment-form button {
            background: #8b5cf6;
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .comment-form button:hover {
            background: #7c3aed;
        }

        /* Create/Edit Post Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }
        .modal-box {
            background: white;
            max-width: 560px;
            width: 100%;
            padding: 2rem;
            border-radius: 28px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.15);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
        }
        .modal-header h3 {
            font-weight: 600;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: #94a3b8;
            transition: 0.2s;
        }
        .modal-close:hover {
            color: #0f172a;
        }

        .hidden {
            display: none !important;
        }

        .toast {
            background: #0f172a;
            color: white;
            padding: 0.6rem 1.4rem;
            border-radius: 40px;
            font-size: 0.9rem;
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            opacity: 0.95;
        }

        .empty-state {
            text-align: center;
            color: #94a3b8;
            padding: 3rem 0;
        }
        .empty-state i {
            font-size: 3rem;
            opacity: 0.4;
            margin-bottom: 0.5rem;
        }

        @media (max-width: 640px) {
            .app-container {
                padding: 0.8rem 1rem;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .header-actions {
                justify-content: space-between;
            }
            .post-header {
                flex-direction: column;
            }
            .modal-box {
                padding: 1.5rem;
                margin: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container" id="app">

        <!-- HEADER -->
        <header class="header">
            <div class="brand"><i class="fas fa-feather-alt"></i>Blog<span>Verse</span></div>
            <div class="header-actions">
                <div id="userWidget" class="user-chip hidden">
                    <span class="user-avatar" id="userAvatar">U</span>
                    <span id="userName">User</span>
                    <button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </header>

        <!-- AUTH CARD -->
        <div id="authCard" class="auth-card">
            <h2 class="auth-title" id="authTitle">Welcome back</h2>
            <p class="auth-sub" id="authSub">Sign in to share your thoughts</p>
            <form id="authForm">
                <div class="form-group">
                    <label for="authEmail">Email</label>
                    <input type="email" id="authEmail" placeholder="alice@example.com" value="alice@blog.com">
                </div>
                <div class="form-group">
                    <label for="authPassword">Password</label>
                    <input type="password" id="authPassword" placeholder="••••••••" value="password123">
                </div>
                <div class="form-group">
                    <label for="authName">Full Name</label>
                    <input type="text" id="authName" placeholder="Alice Johnson" value="Alice Johnson">
                </div>
                <button type="submit" class="btn-primary" id="authSubmitBtn">Sign In</button>
            </form>
            <p style="margin-top:1.2rem; font-size:0.9rem; color:#475569;">
                <span id="authToggleText">Don't have an account?</span>
                <button class="auth-toggle" id="authToggleBtn">Sign Up</button>
            </p>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard" class="hidden">

            <!-- Create Post Button -->
            <div style="display:flex; gap:0.8rem; flex-wrap:wrap; margin-bottom:1.5rem;">
                <button class="btn-primary" id="newPostBtn"><i class="fas fa-plus"></i> New Post</button>
            </div>

            <!-- Posts Feed -->
            <div id="postsContainer">
                <div class="empty-state"><i class="fas fa-pen-fancy"></i><p>No posts yet. Start writing!</p></div>
            </div>
        </div>

        <!-- MODAL: Create / Edit Post -->
        <div id="postModal" class="modal-overlay hidden">
            <div class="modal-box">
                <div class="modal-header">
                    <h3 id="modalTitle">Create New Post</h3>
                    <button class="modal-close" id="modalCloseBtn">&times;</button>
                </div>
                <form id="postForm">
                    <div class="form-group">
                        <label for="postTitleInput">Title</label>
                        <input type="text" id="postTitleInput" placeholder="My awesome blog post" required>
                    </div>
                    <div class="form-group">
                        <label for="postContentInput">Content</label>
                        <textarea id="postContentInput" rows="5" placeholder="Write your thoughts..." required></textarea>
                    </div>
                    <input type="hidden" id="postEditId" value="">
                    <button type="submit" class="btn-primary" style="width:100%;" id="postSubmitBtn">Publish</button>
                </form>
            </div>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ---- DATA STORE (simulates database) ----
            let users = [
                { id: 'u1', email: 'alice@blog.com', password: 'password123', name: 'Alice Johnson' },
                { id: 'u2', email: 'bob@blog.com', password: 'password123', name: 'Bob Smith' },
            ];

            let posts = [
                {
                    id: 'p1',
                    title: 'Getting Started with Blogging',
                    content: 'Blogging is a wonderful way to share your ideas with the world. Start by writing about what you love.',
                    authorId: 'u1',
                    createdAt: new Date(Date.now() - 86400000 * 2).toISOString(),
                    comments: [
                        { id: 'c1', authorId: 'u2', text: 'Great advice! I\'m starting my blog today.', createdAt: new Date(Date
                                .now() - 86400000).toISOString() },
                        { id: 'c2', authorId: 'u1', text: 'Thanks Bob! Good luck with your blog.', createdAt: new Date(Date
                                .now() - 3600000 * 5).toISOString() }
                    ]
                },
                {
                    id: 'p2',
                    title: 'The Future of Web Development',
                    content: 'Web development is evolving rapidly. Frameworks like React and Vue continue to dominate, while AI tools are changing how we code.',
                    authorId: 'u2',
                    createdAt: new Date(Date.now() - 86400000 * 1).toISOString(),
                    comments: [
                        { id: 'c3', authorId: 'u1', text: 'AI-powered coding assistants are a game changer!', createdAt: new Date(
                                Date.now() - 3600000 * 2).toISOString() }
                    ]
                }
            ];

            let currentUser = null;
            let editingPostId = null;

            // ---- DOM refs ----
            const authCard = document.getElementById('authCard');
            const dashboard = document.getElementById('dashboard');
            const userWidget = document.getElementById('userWidget');
            const userName = document.getElementById('userName');
            const userAvatar = document.getElementById('userAvatar');
            const logoutBtn = document.getElementById('logoutBtn');

            const authTitle = document.getElementById('authTitle');
            const authSub = document.getElementById('authSub');
            const authSubmitBtn = document.getElementById('authSubmitBtn');
            const authToggleBtn = document.getElementById('authToggleBtn');
            const authToggleText = document.getElementById('authToggleText');
            const authForm = document.getElementById('authForm');
            const authEmail = document.getElementById('authEmail');
            const authPassword = document.getElementById('authPassword');
            const authName = document.getElementById('authName');

            const postsContainer = document.getElementById('postsContainer');
            const newPostBtn = document.getElementById('newPostBtn');

            const postModal = document.getElementById('postModal');
            const modalCloseBtn = document.getElementById('modalCloseBtn');
            const modalTitle = document.getElementById('modalTitle');
            const postForm = document.getElementById('postForm');
            const postTitleInput = document.getElementById('postTitleInput');
            const postContentInput = document.getElementById('postContentInput');
            const postEditId = document.getElementById('postEditId');
            const postSubmitBtn = document.getElementById('postSubmitBtn');

            let isLoginMode = true;

            // ---- helpers ----
            function showToast(msg) {
                let t = document.querySelector('.toast');
                if (!t) { t = document.createElement('div');
                    t.className = 'toast';
                    document.body.appendChild(t); }
                t.textContent = msg;
                t.style.opacity = '1';
                clearTimeout(t._hide);
                t._hide = setTimeout(() => { t.style.opacity = '0'; }, 2200);
            }

            function generateId() { return '_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6); }

            function getUserName(id) {
                const u = users.find(u => u.id === id);
                return u ? u.name : 'Unknown';
            }

            function formatDate(iso) {
                if (!iso) return '';
                const d = new Date(iso);
                return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            // ---- auth ----
            function setAuthMode(login) {
                isLoginMode = login;
                if (login) {
                    authTitle.textContent = 'Welcome back';
                    authSub.textContent = 'Sign in to share your thoughts';
                    authSubmitBtn.textContent = 'Sign In';
                    authToggleText.textContent = "Don't have an account?";
                    authToggleBtn.textContent = 'Sign Up';
                    authName.parentElement.classList.add('hidden');
                } else {
                    authTitle.textContent = 'Create account';
                    authSub.textContent = 'Join the BlogVerse community';
                    authSubmitBtn.textContent = 'Sign Up';
                    authToggleText.textContent = 'Already have an account?';
                    authToggleBtn.textContent = 'Sign In';
                    authName.parentElement.classList.remove('hidden');
                }
            }

            function handleAuth(e) {
                e.preventDefault();
                const email = authEmail.value.trim();
                const password = authPassword.value.trim();
                const name = authName.value.trim() || email.split('@')[0] || 'User';

                if (!email || !password) return showToast('Please fill in all fields');

                if (isLoginMode) {
                    const found = users.find(u => u.email === email && u.password === password);
                    if (!found) return showToast('Invalid credentials');
                    currentUser = { ...found };
                    showToast(`Welcome back, ${currentUser.name}!`);
                    renderApp();
                } else {
                    if (users.find(u => u.email === email)) return showToast('Email already registered');
                    const newUser = {
                        id: 'u' + Date.now(),
                        email,
                        password,
                        name: name || 'User'
                    };
                    users.push(newUser);
                    currentUser = { ...newUser };
                    showToast(`Account created! Welcome ${currentUser.name}`);
                    renderApp();
                }
            }

            function logout() {
                currentUser = null;
                editingPostId = null;
                renderApp();
                showToast('Logged out');
                closeModal();
            }

            // ---- posts CRUD ----
            function getPosts() {
                // return posts sorted by newest first
                return [...posts].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            }

            function createPost(title, content) {
                if (!currentUser) return showToast('Please login first');
                const newPost = {
                    id: 'p' + Date.now(),
                    title: title.trim(),
                    content: content.trim(),
                    authorId: currentUser.id,
                    createdAt: new Date().toISOString(),
                    comments: []
                };
                posts.push(newPost);
                renderPosts();
                showToast('Post published!');
            }

            function updatePost(id, title, content) {
                const post = posts.find(p => p.id === id);
                if (!post) return showToast('Post not found');
                if (post.authorId !== currentUser.id) return showToast('You can only edit your own posts');
                post.title = title.trim();
                post.content = content.trim();
                renderPosts();
                showToast('Post updated');
            }

            function deletePost(id) {
                const post = posts.find(p => p.id === id);
                if (!post) return;
                if (post.authorId !== currentUser.id) return showToast('You can only delete your own posts');
                posts = posts.filter(p => p.id !== id);
                renderPosts();
                showToast('Post deleted');
            }

            // ---- comments ----
            function addComment(postId, text) {
                if (!currentUser) return showToast('Please login to comment');
                if (!text.trim()) return showToast('Comment cannot be empty');
                const post = posts.find(p => p.id === postId);
                if (!post) return showToast('Post not found');
                const comment = {
                    id: 'c' + Date.now(),
                    authorId: currentUser.id,
                    text: text.trim(),
                    createdAt: new Date().toISOString()
                };
                post.comments.push(comment);
                renderPosts();
                showToast('Comment added');
            }

            function deleteComment(postId, commentId) {
                const post = posts.find(p => p.id === postId);
                if (!post) return;
                const comment = post.comments.find(c => c.id === commentId);
                if (!comment) return;
                if (comment.authorId !== currentUser.id && post.authorId !== currentUser.id) {
                    return showToast('You can only delete your own comments');
                }
                post.comments = post.comments.filter(c => c.id !== commentId);
                renderPosts();
                showToast('Comment deleted');
            }

            // ---- render ----
            function renderPosts() {
                const sorted = getPosts();
                if (!sorted.length) {
                    postsContainer.innerHTML =
                        `<div class="empty-state"><i class="fas fa-pen-fancy"></i><p>No posts yet. Start writing!</p></div>`;
                    return;
                }
                let html = '';
                sorted.forEach(post => {
                    const isAuthor = currentUser && post.authorId === currentUser.id;
                    const authorName = getUserName(post.authorId);
                    const commentCount = post.comments ? post.comments.length : 0;

                    html += `
                        <div class="post-card" data-post-id="${post.id}">
                            <div class="post-header">
                                <div>
                                    <div class="post-title">${escapeHtml(post.title)}</div>
                                    <div class="post-meta">
                                        <span class="post-author"><i class="fas fa-user"></i> ${escapeHtml(authorName)}</span>
                                        <span><i class="far fa-calendar-alt"></i> ${formatDate(post.createdAt)}</span>
                                        <span><i class="far fa-comment"></i> ${commentCount}</span>
                                    </div>
                                </div>
                                ${isAuthor ? `
                                    <div class="post-actions">
                                        <button class="btn-outline edit-post-btn" data-id="${post.id}" style="padding:0.2rem 0.8rem; font-size:0.8rem;">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                        <button class="btn-danger delete-post-btn" data-id="${post.id}" style="padding:0.2rem 0.8rem;">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                ` : ''}
                            </div>
                            <div class="post-content">${escapeHtml(post.content)}</div>

                            <!-- Comments -->
                            <div class="comment-section">
                                ${post.comments && post.comments.length ? post.comments.map(c => {
                                    const isCommentAuthor = currentUser && (c.authorId === currentUser.id || post.authorId === currentUser.id);
                                    return `
                                        <div class="comment-item">
                                            <div class="comment-author">${escapeHtml(getUserName(c.authorId))}</div>
                                            <div class="comment-text">${escapeHtml(c.text)}</div>
                                            <div class="comment-meta">
                                                ${formatDate(c.createdAt)}
                                                ${isCommentAuthor ? `
                                                    <button class="delete-comment-btn" style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:0.7rem;margin-left:0.5rem;" 
                                                            data-postid="${post.id}" data-commentid="${c.id}">
                                                        <i class="fas fa-times"></i>
                                                    </button>
                                                ` : ''}
                                            </div>
                                        </div>
                                    `;
                                }).join('') : ''}

                                <!-- Add Comment -->
                                <form class="comment-form" data-postid="${post.id}">
                                    <input type="text" placeholder="Write a comment..." required>
                                    <button type="submit"><i class="fas fa-paper-plane"></i></button>
                                </form>
                            </div>
                        </div>
                    `;
                });
                postsContainer.innerHTML = html;
            }

            function escapeHtml(text) {
                const d = document.createElement('div');
                d.textContent = text;
                return d.innerHTML;
            }

            function renderApp() {
                if (currentUser) {
                    authCard.classList.add('hidden');
                    dashboard.classList.remove('hidden');
                    userWidget.classList.remove('hidden');
                    userName.textContent = currentUser.name;
                    userAvatar.textContent = currentUser.name.charAt(0).toUpperCase();
                    renderPosts();
                } else {
                    authCard.classList.remove('hidden');
                    dashboard.classList.add('hidden');
                    userWidget.classList.add('hidden');
                }
            }

            // ---- modal ----
            function openModal(postId = null) {
                postModal.classList.remove('hidden');
                if (postId) {
                    const post = posts.find(p => p.id === postId);
                    if (post && post.authorId === currentUser.id) {
                        modalTitle.textContent = 'Edit Post';
                        postSubmitBtn.textContent = 'Update';
                        postTitleInput.value = post.title;
                        postContentInput.value = post.content;
                        postEditId.value = postId;
                        editingPostId = postId;
                    } else {
                        showToast('You can only edit your own posts');
                        closeModal();
                        return;
                    }
                } else {
                    modalTitle.textContent = 'Create New Post';
                    postSubmitBtn.textContent = 'Publish';
                    postTitleInput.value = '';
                    postContentInput.value = '';
                    postEditId.value = '';
                    editingPostId = null;
                }
                setTimeout(() => postTitleInput.focus(), 100);
            }

            function closeModal() {
                postModal.classList.add('hidden');
                editingPostId = null;
                postEditId.value = '';
            }

            // ---- event delegation ----
            function setupEvents() {
                // Auth
                authToggleBtn.addEventListener('click', () => setAuthMode(!isLoginMode));
                authForm.addEventListener('submit', handleAuth);
                logoutBtn.addEventListener('click', logout);

                // New post
                newPostBtn.addEventListener('click', () => openModal(null));

                // Modal close
                modalCloseBtn.addEventListener('click', closeModal);
                postModal.addEventListener('click', (e) => {
                    if (e.target === postModal) closeModal();
                });

                // Post form submit
                postForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const title = postTitleInput.value.trim();
                    const content = postContentInput.value.trim();
                    if (!title || !content) return showToast('Please fill in all fields');
                    const editId = postEditId.value;
                    if (editId) {
                        updatePost(editId, title, content);
                    } else {
                        createPost(title, content);
                    }
                    closeModal();
                });

                // Posts container events (delete, edit, comment)
                postsContainer.addEventListener('click', (e) => {
                    const target = e.target.closest('button');
                    if (!target) return;

                    // Delete post
                    if (target.classList.contains('delete-post-btn')) {
                        const id = target.dataset.id;
                        if (confirm('Delete this post?')) deletePost(id);
                        return;
                    }

                    // Edit post
                    if (target.classList.contains('edit-post-btn')) {
                        const id = target.dataset.id;
                        openModal(id);
                        return;
                    }

                    // Delete comment
                    if (target.classList.contains('delete-comment-btn')) {
                        const postId = target.dataset.postid;
                        const commentId = target.dataset.commentid;
                        if (confirm('Delete this comment?')) deleteComment(postId, commentId);
                        return;
                    }
                });

                // Comment form submit
                postsContainer.addEventListener('submit', (e) => {
                    if (e.target.classList.contains('comment-form')) {
                        e.preventDefault();
                        const postId = e.target.dataset.postid;
                        const input = e.target.querySelector('input[type="text"]');
                        if (!input) return;
                        const text = input.value.trim();
                        if (!text) return showToast('Comment cannot be empty');
                        addComment(postId, text);
                        input.value = '';
                    }
                });

                // Keyboard shortcut: Escape to close modal
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') closeModal();
                });
            }

            // ---- init ----
            setAuthMode(true);
            renderApp();
            setupEvents();

            // Make auth name optional in login mode
            authName.parentElement.classList.add('hidden');

            // Prefill with demo data
            // already done

        })();
    </script>
</body>
</html>
